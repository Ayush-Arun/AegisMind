[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-graph"
version = "0.1.0"
description = "Knowledge graph engine for AegisMind sovereign second brain"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
