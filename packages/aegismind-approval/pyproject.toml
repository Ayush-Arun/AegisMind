[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-approval"
version = "0.1.0"
description = "Human-in-the-loop approval gate for AegisMind sovereign agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "aegismind-types",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
