name: aegismind

services:
  agora:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agora
    image: aegismind/agora:latest
    pull_policy: build
    container_name: aegismind-agora
    restart: unless-stopped
    environment:
      AEGISMIND_ENV: production
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGORA_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aegismind-net

  lens:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.lens
    image: aegismind/lens:latest
    pull_policy: build
    container_name: aegismind-lens
    restart: unless-stopped
    ports:
      - "${LENS_PORT:-3000}:80"
    depends_on:
      agora:
        condition: service_started
    networks:
      - aegismind-net

networks:
  aegismind-net:
    driver: bridge
